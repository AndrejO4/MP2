<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Experiment</title>
</head>
<body id="main-body">

<script>
    const isGamified = true;

    const CONFIG = {
        gamified: {
            id: "1FAIpQLSe2FhOKeHdv28PinVWgF-4WMeCtvteXR1f65Oehddv2zGVsDg",
            entry: "1413277891"
        },
        nonGamified: {
            id: "1FAIpQLSfi1cbMODhutOUXl8hI7GXPAWFbBKd20P-lHujfQpgxtZzCGg",
            entry: "821841735"
        }
    };

    const nonGamifiedHTML = `
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #2b87d1; color: white; margin: 0; padding: 20px; user-select: none; }
        .instructions { max-width: 400px; text-align: center; background: rgba(0, 0, 0, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        #game-container { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; margin: 20px 0; pointer-events: none; opacity: 0.7; }
        #game-container.active { pointer-events: auto; opacity: 1; }
        .tile { width: 100px; height: 100px; background-color: rgba(255, 255, 255, 0.2); border-radius: 10px; cursor: pointer; transition: background-color 0.1s; }
        .tile.flash { background-color: white !important; }
        #status { font-size: 1.8rem; font-weight: bold; margin: 10px 0; height: 40px; }
        button { padding: 15px 40px; font-size: 1.2rem; background-color: #ffd700; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
    <h1>Sequence Memory</h1>
    <div class="instructions"><strong>Instructions:</strong> Remember the sequence of the flashing tiles and then repeat it.</div>
    <div id="status">Ready?</div>
    <div id="game-container">
        <div class="tile" data-index="0"></div><div class="tile" data-index="1"></div><div class="tile" data-index="2"></div>
        <div class="tile" data-index="3"></div><div class="tile" data-index="4"></div><div class="tile" data-index="5"></div>
        <div class="tile" data-index="6"></div><div class="tile" data-index="7"></div><div class="tile" data-index="8"></div>
    </div>
    <button id="start-btn">Start game</button>
    `;

    const gamifiedHTML = `
    <style>
        :root { --primary: #58cc02; --accent: #ffc800; --bg: #131f24; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: var(--bg); color: white; margin: 0; padding: 20px; user-select: none; }
        .stats-header { display: flex; gap: 20px; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 20px; border-bottom: 4px solid rgba(0,0,0,0.2); }
        .stat-item { text-align: center; min-width: 80px; }
        .stat-value { font-size: 1.6rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.7; letter-spacing: 1px; }
        .instructions { max-width: 400px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.1); }
        .progress-container { width: 320px; height: 14px; background: #3f494e; border-radius: 10px; margin-bottom: 25px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #58cc02, #a5ed6e); transition: width 0.3s ease-out; }
        #game-container { display: grid; grid-template-columns: repeat(3, 100px); gap: 12px; margin: 15px 0; pointer-events: none; }
        #game-container.active { pointer-events: auto; }
        .tile { width: 100px; height: 100px; background-color: #2e3c42; border-radius: 18px; cursor: pointer; border-bottom: 6px solid #1a2327; transition: all 0.1s; }
        .tile.flash { background-color: #fff !important; transform: scale(0.92); border-bottom-width: 2px; }
        #status { font-size: 1.3rem; font-weight: bold; height: 40px; margin: 10px 0; text-align: center; }
        button { padding: 16px 45px; font-size: 1.1rem; background-color: var(--primary); border: none; border-radius: 16px; cursor: pointer; color: white; font-weight: bold; border-bottom: 5px solid #46a302; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; }
    </style>
    <div class="stats-header">
        <div class="stat-item"><div class="stat-label">Level</div><div id="level-val" class="stat-value">1</div></div>
        <div class="stat-item"><div class="stat-label">Personal Best</div><div id="pb-val" class="stat-value">0</div></div>
        <div class="stat-item"><div class="stat-label">XP</div><div id="xp-val" class="stat-value">0</div></div>
    </div>
    <div class="instructions"><strong>Instructions:</strong> Remember the sequence of the flashing tiles and then repeat it.</div>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <div id="status">Ready for the challenge?</div>
    <div id="game-container">
        <div class="tile" data-index="0"></div><div class="tile" data-index="1"></div><div class="tile" data-index="2"></div>
        <div class="tile" data-index="3"></div><div class="tile" data-index="4"></div><div class="tile" data-index="5"></div>
        <div class="tile" data-index="6"></div><div class="tile" data-index="7"></div><div class="tile" data-index="8"></div>
    </div>
    <button id="start-btn">Start game</button>
    `;

    document.body.innerHTML = isGamified ? gamifiedHTML : nonGamifiedHTML;

    const tiles = document.querySelectorAll('.tile');
    const grid = document.getElementById('game-container');
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status');
    const progressBar = document.getElementById('progress-bar');
    const xpDisplay = document.getElementById('xp-val');
    const levelDisplay = document.getElementById('level-val');
    const pbDisplay = document.getElementById('pb-val');

    let sequence = [], playerSequence = [], level = 1, xp = 0, personalBest = 0;
    let isPlayingSequence = false, gameActive = false;

    const messages = ["Amazing!", "Great focus!", "You're on fire!", "Perfect!", "Unstoppable!"];
    const benchmarkStats = [0.00, 1.50, 2.80, 5.20, 8.40, 12.10, 18.50, 29.30, 42.10, 55.80, 68.40, 77.20, 84.10, 89.30, 92.80, 95.10, 96.70, 97.80, 98.50, 99.00, 99.35, 99.55, 99.70, 99.80, 99.86, 99.91, 99.94, 99.96, 99.97, 99.98, 99.99];

    startBtn.addEventListener('click', () => {
        sequence = []; level = 1; xp = 0;
        if (isGamified) { progressBar.style.width = '0%'; updateUI(); }
        gameActive = true; grid.classList.add('active'); startBtn.style.visibility = 'hidden';
        nextRound();
    });

    function nextRound() {
        playerSequence = [];
        if (isGamified) {
            statusText.style.color = "#58cc02";
            statusText.innerText = level > 1 ? messages[Math.floor(Math.random()*messages.length)] : "Watch...";
            updateUI();
        } else { statusText.innerText = `Level: ${level}`; }
        sequence.push(Math.floor(Math.random() * 9));
        playSequence();
    }

    async function playSequence() {
        isPlayingSequence = true;
        await new Promise(r => setTimeout(r, 800));
        for (const index of sequence) {
            tiles[index].classList.add('flash');
            await new Promise(r => setTimeout(r, 400));
            tiles[index].classList.remove('flash');
            await new Promise(r => setTimeout(r, 200));
        }
        isPlayingSequence = false;
    }

    tiles.forEach(tile => {
        tile.addEventListener('click', (e) => {
            if (!gameActive || isPlayingSequence) return;
            const idx = parseInt(e.target.getAttribute('data-index'));
            e.target.classList.add('flash');
            setTimeout(() => e.target.classList.remove('flash'), 200);
            
            playerSequence.push(idx);
            const step = playerSequence.length;
            if (isGamified) progressBar.style.width = `${(step / sequence.length) * 100}%`;

            if (playerSequence[step-1] !== sequence[step-1]) {
                gameOver();
                return;
            }

            if (step === sequence.length) {
                if (isGamified) { xp += (level * 15); if(level > personalBest) personalBest = level; }
                level++;
                setTimeout(() => { if (isGamified) progressBar.style.width = '0%'; nextRound(); }, 500);
            }
        });
    });

    function updateUI() {
        if(levelDisplay) levelDisplay.innerText = level;
        if(xpDisplay) xpDisplay.innerText = xp;
        if(pbDisplay) pbDisplay.innerText = personalBest;
    }

    function gameOver() {
        gameActive = false; grid.classList.remove('active'); startBtn.style.visibility = 'visible';
        
        if (isGamified) {
            const perc = level < benchmarkStats.length ? benchmarkStats[level] : 99.99;
            statusText.style.color = "white";
            statusText.innerHTML = `Excellent – try again!<br><small>You beat ${perc}% of other players.</small>`;
            startBtn.innerText = "New Game";
        } else {
            statusText.innerText = `Game Over! Level: ${level}`;
            startBtn.innerText = "Play Again";
        }
        
        sendDataToGoogle(level);
    }

    function sendDataToGoogle(score) {
        const currentTarget = isGamified ? CONFIG.gamified : CONFIG.nonGamified;
        
        const url = `https://docs.google.com/forms/d/e/${currentTarget.id}/formResponse`;
        const formData = new URLSearchParams();
        formData.append(`entry.${currentTarget.entry}`, score);

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        }).then(() => console.log(`Sent to ${isGamified ? 'GAMIFIED' : 'NON-GAMIFIED'} formular: ` + score))
          .catch(err => console.error("Error", err));
    }
</script>
</body>
</html>
